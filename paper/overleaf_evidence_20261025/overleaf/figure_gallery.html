olic illustration derived from verified logical definitions; not an empirical measurement or neural graph.</p><a href="../figures/02_three_evidence_states.svg">Vector SVG</a> · <a href="../figures/02_three_evidence_states_source.json">Source values and hashes</a></figcaption></figure><figure><h2>03 recorded failure examples</h2><a href="../figures/03_recorded_failure_examples.png"><img src="../figures/03_recorded_failure_examples.png" alt="Original, hash-verified stimuli for xc_ho_0011 entailed, contradicted and underdetermined development variants. Historical Qwen CE+ES5 generated Yes, No and No, respectively. Text premises are printed under each image."></a><figcaption><b>HISTORICAL OBSERVATIONS</b><p>Original, hash-verified stimuli for xc_ho_0011 entailed, contradicted and underdetermined development variants. Historical Qwen CE+ES5 generated Yes, No and No, respectively. Text premises are printed under each image.</p><p>One exposed development family, not independent generalization. Images are original controlled benchmark stimuli; literal 2D shapes are disc and wedge.</p><a href="../figures/03_recorded_failure_examples.svg">Vector SVG</a> · <a href="../figures/03_recorded_failure_examples_source.json">Source values and hashes</a></figcaption></figure><figure><h2>04 checkpoint comparison</h2><a href="../figures/04_checkpoint_comparison.png"><img src="../figures/04_checkpoint_comparison.png" alt="Recomputed Qwen balanced accuracy on the same 18 development cases/six families. Prompt is frozen Qwen with augmented abstention instructions; CE50 and CE+ES5 have different update budgets."></a><figcaption><b>HISTORICAL OBSERVATIONS</b><p>Recomputed Qwen balanced accuracy on the same 18 development cases/six families. Prompt is frozen Qwen with augmented abstention instructions; CE50 and CE+ES5 have different update budgets.</p><p>Repeated development inspection; no superiority claim. Paired CE+ES5 minus CE5 interval includes zero; no uncertainty bars are invented here. e recomputed separately. CE50 is 12/18 correct under the historical parser, 0/18 semantic-invalid and 0/18 exact-label compliant.</p><p>Exact-label check trims outer whitespace only for classification; raw strings remain unchanged in the evidence.</p><a href="../figures/07_format_vs_correctness.svg">Vector SVG</a> · <a href="../figures/07_format_vs_correctness_source.json">Source values and hashes</a></figcaption></figure><figure><h2>08 five step losses</h2><a href="../figures/08_five_step_losses.png"><img src="../figures/08_five_step_losses.png" alt="Exact observed CE, ES and CE+0.25 ES at five updates. No lines, smoothing or interpolated points are added."></a><figcaption><b>HISTORICAL OBSERVATIONS</b><p>Exact observed CE, ES and CE+0.25 ES at five updates. No lines, smoothing or interpolated points are added.</p><p>Five selected updates cannot establish optimization convergence, method benefit or generalization.</p><a href="../figures/08_five_step_losses.svg">Vector SVG</a> · <a href="../figures/08_five_step_losses_source.json">Source values and hashes</a></figcaption></figure><figure><h2>09 gpu memory</h2><a href="../figures/09_gpu_memory.png"><img src="../figures/09_gpu_memory.png" alt="Per-update allocator maxima during the historical five-update pilot. Dedicated device capacity is 4096 MiB; allocator usage is distinct from sampled NVIDIA physical usage."></a><figcaption><b>HISTORICAL OBSERVATIONS</b><p>Per-update allocator maxima during the historical five-update pilot. Dedicated device capacity is 4096 MiB; allocator usage is distinct from sampled NVIDIA physical usage.</p><p>Sampled physical memory peaks can miss transient allocations. This mission made zero new model forwards and passed no replication RAM admission.</p><a href="../figures/09_gpu_memory.svg">Vector SVG</a> · <a href="../figures/09_gpu_memory_source.json">Source values and hashes</a></figcaption></figure><figure><h2>10 historical smol probes</h2><a href="../figures/10_historical_smol_probes.
