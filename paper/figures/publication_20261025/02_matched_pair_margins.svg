  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(58.687031 351.420375)">Twelve additional forwards; two fixed cases in one exposed development family.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(58.687031 364.897719)">Both margins remain positive in both models: the proposed opposed-margin causal screen fails.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(58.687031 378.375062)">Within-model score contrasts only; unequal axes and model scales are not cross-model calibrated confidence.</text>
