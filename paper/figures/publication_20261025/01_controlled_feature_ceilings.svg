  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(52.752187 403.332375)">*Oracle-parsed roles, not VLM inference. Exact design fractions: single modality 2/3; nuisance 1/3; joint oracle 1.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(52.752187 416.809719)">9,216 variants / six dependent development families; three fit and three evaluate lookups.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(52.752187 430.287062)">Only specified feature classes audited; neither independent confirmation nor exhaustive shortcut removal.</text>
