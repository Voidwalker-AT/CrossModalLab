  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(13.939375 355.692375)">Stored Phase 2C-C development evidence, 18 paired cases / six families per model. Higher recall is better.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(13.939375 369.169719)">Qwen BA 55.6%; Smol BA 44.4%. Paired descriptive difference CI: -11.1 to 27.8 percentage points.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(13.939375 382.647063)">Reanalysis of old outputs, not new replication; exact-format compliance differs and model superiority is not established.</text>
  </g>
