  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(7.2 341.868375)">Historical scope: 18 validation cases; new factorial: 96 development cases / 12 families.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(7.2 355.345719)">Oracle-parsed features, not model behavior. Counterbalancing removes deterministic strata.</text>
